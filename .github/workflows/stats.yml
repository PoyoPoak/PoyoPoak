# Rebuilds assets/dashboard.svg daily. See MAINTENANCE.md.
name: stats
on:
  schedule:
    - cron: "17 13 * * *" # daily, 05:17 Pacific standard time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/test_stats.py
      - run: |
          [ -n "$STATS_TOKEN" ] || echo "::warning::STATS_TOKEN is not set, so stats cover public repositories only. See MAINTENANCE.md."
          python3 scripts/stats.py
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dashboard.svg
          git diff --cached --quiet || (git commit -m "chore: refresh dashboard" && git push)
